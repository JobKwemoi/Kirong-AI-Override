  sparks=sparks.filter(function(p){return p.l>0});
  for(i=0;i<sparks.length;i++){var p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.99;p.l--;g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}
  g.shadowBlur=0;g.globalAlpha=1;
  if(!reduce)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
var PAL=["#ffd98a","#f472b6","#8b5cf6","#7dd3fc","#ffffff","#ffb54a"];
function burst(x,y){if(reduce)return;var c=PAL[Math.floor(Math.random()*PAL.length)];for(var i=0;i<54;i++){var a=Math.random()*6.283,v=1.2+Math.random()*4.2,l=70+Math.random()*50;sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:l,m:l,r:1.4+Math.random()*1.6,c:Math.random()<.3?"#fff":c})}}
function show(el,flex){el.style.display=flex||"block";requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add("in")})})}
/* ---------- the letter: one page at a time, always centred ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/(Chief|KIRONG(?: AI)?)/g,'<b class="g">$1</b>')}
async function typeLetter(){
  var st=$("lstage"),skipBtn=$("skip");skipBtn.style.display="block";typing=true;
  for(var s=0;s<S.length&&!skip;s++){
    var pg=document.createElement("div");pg.className="pg";st.appendChild(pg);var total=0;
    for(var l=0;l<S[s].length&&!skip;l++){
      var raw=S[s][l],sig=raw.charAt(0)==="*",txt=sig?raw.slice(1):raw;total+=txt.length;
      var ln=document.createElement("div");ln.className="ln"+(sig?" sig":"");pg.appendChild(ln);ln.classList.add("typing");
      for(var i=0;i<txt.length&&!skip;i++){
        ln.innerHTML=esc(txt.slice(0,i+1));
        if(i%2===0&&txt.charAt(i)!==" ")tick();
        if(i%5===0)st.scrollTop=st.scrollHeight;
        var c=txt.charAt(i);await sleep(c===","?170:/[.?:]/.test(c)?230:30);await nextFrame();
      }
      ln.innerHTML=esc(txt);ln.classList.remove("typing");st.scrollTop=st.scrollHeight;
      await sleep(420);
    }
    await sleep(900+total*22);
    pg.classList.add("fade");await sleep(950);pg.remove();
  }
  typing=false;skipBtn.style.display="none";st.innerHTML="";showCake();
}
function showCake(){show($("cakeSec"),"flex")}
/* ---------- blow the candle ---------- */
function say(t){$("status").textContent=t}
function blowOut(){
  if(done)return;done=true;cancelAnimationFrame(raf2);
  try{stream&&stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  $("flame").style.transform="";$("cake").classList.add("out");
  $("blowBtn").style.display="none";say("");document.body.classList.add("dim");
  setTimeout(function(){
    document.body.classList.remove("dim");birthdaySong();
    for(var k=0;k<9;k++)(function(k){setTimeout(function(){burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4))},k*520)})(k);
  },1700);
  setTimeout(function(){$("cakeSec").classList.remove("in")},6200);
  setTimeout(function(){
    $("cakeSec").style.display="none";show($("final"),"flex");
    var h=$("heart");setTimeout(function(){h.style.setProperty("--bpm","1.1s")},3000);setTimeout(function(){h.style.setProperty("--bpm","0.7s")},6000);
    setInterval(function(){if(!muted||true)burst(W*Math.random(),H*(.1+Math.random()*.35))},1600);
  },8600);
}
async function startBlow(){
  if(started||done)return;started=true;
  var b=$("blowBtn");b.disabled=true;b.textContent="[ BLOW NOW ]";
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(!ac)audioInit();
    var an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(stream).connect(an);
    var buf=new Uint8Array(an.fftSize),t0=performance.now(),last=t0,amb=0,n=0,loud=0,flame=$("flame");
    say("Listening… blow gently into your phone");
    (function loop(){
      if(done)return;
      an.getByteTimeDomainData(buf);var sum=0;
      for(var i=0;i<buf.length;i++){var x=(buf[i]-128)/128;sum+=x*x}
      var rms=Math.sqrt(sum/buf.length),now=performance.now(),dt=now-last;last=now;
      if(now-t0<800){amb+=rms;n++}
      else{
        var th=Math.max(0.1,(amb/Math.max(1,n))*3.2);
        flame.style.transform="rotate("+Math.min(16,(rms/th)*10)+"deg)";
        if(rms>th)loud+=dt;else loud=Math.max(0,loud-dt*1.5);
        if(loud>380){blowOut();return}
      }
      raf2=requestAnimationFrame(loop);
    })();
  }catch(e){fallback=true;b.style.display="none";say("Mic unavailable — tap the candle to blow it out")}
}
$("blowBtn").addEventListener("click",startBlow);
$("candle").addEventListener("click",function(){if(!started)startBlow();else if(fallback)blowOut()});
$("skip").addEventListener("click",function(){skip=true});
$("again").addEventListener("click",function(){location.reload()});

  setTimeout(function(){
    intro.classList.add("gone");
    setTimeout(function(){intro.style.display="none";$("gate").style.display="none";typeLetter()},1100);
  },reduce?1500:6200);
  });});
});
})();
